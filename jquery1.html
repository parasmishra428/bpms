<!DOCTYPE html>
<html>
<head>
    <title>jQuery Example</title>
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
</head>
<body>
<p id="demo">Hello</p>
<button id="btn">Click Me</button>

<script>
$(document).ready(function(){
    $("#btn").click(function(){
        $("#demo").text("Welcome to jQuery!");
    });
});
</script>

</body>
</htm>
